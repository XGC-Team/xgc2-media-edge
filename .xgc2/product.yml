schema: xgc2.product.v1
id: xgc2-media-edge
name: XGC2 Media Edge
version: 0.5.0-1
kind: toolchain-apt
summary: XGC2 source lifecycle and scientific metadata wrapper around pinned MediaMTX
  H264/RTP, WHEP/WebRTC fanout, and stream-copy recording.
apt:
  distribution: focal,jammy,noble
  install:
  - xgc2-media-edge
  packages:
  - xgc2-media-edge
  depends:
  - ca-certificates
usage:
  install: 'sudo apt update

    sudo apt install xgc2-media-edge

    '
  smoke_test: 'xgc-media-edge --version

    '
  notes: 'The process is started and supervised by an XGC2 process definition.

  This package deliberately installs no systemd unit and has no dependency on

    ROS, XGC2 Core, or XGC2 Agent.

    MediaMTX v1.20.0 is bundled and checksum-pinned; no runtime download occurs.

    '
ownership:
  paths:
  - /usr/bin/xgc-media-edge
  - /usr/lib/xgc2-media-edge/mediamtx
release:
  repository: lxk36/xgc2-media-edge
  ref: main
  workflow: release.yml
  ci_workflow: ci.yml
  apt_versions:
    focal: 0.5.0-1~focal
    jammy: 0.5.0-1~jammy
    noble: 0.5.0-1~noble
